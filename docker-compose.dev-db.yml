# Configuration pour le développement - MongoDB uniquement
# Usage: docker-compose -f docker-compose.dev-db.yml up

services:
  mongodb:
    image: mongo:7.0
    container_name: chronicle-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chronicle
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/chronicle --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
